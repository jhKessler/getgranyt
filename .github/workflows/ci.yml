# =====================================================
# Granyt App - CI/CD Pipeline
# =====================================================
# 1. Runs linting and tests on PRs and pushes
# 2. Builds and publishes Docker images on pushes to main/dev/tags
# =====================================================

name: CI/CD

on:
  push:
    branches:
      - main
      - staging
    tags:
      - 'v*.*.*'
    paths:
      - 'granyt-app/**'
      - '.github/workflows/ci.yml'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag for the image (optional)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jhkessler/granyt-app

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./granyt-app

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: granyt
          POSTGRES_PASSWORD: granyt-password
          POSTGRES_DB: granyt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://granyt:granyt-password@localhost:5432/granyt_test?schema=public
      BETTER_AUTH_SECRET: ci-test-secret-not-real-32chars
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './granyt-app/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema
        run: npx prisma db push --skip-generate

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test


  # Build for amd64 on standard runner
  build-amd64:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      app-digest: ${{ steps.build-app.outputs.digest }}
      migrations-digest: ${{ steps.build-migrations.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push App image (amd64)
        id: build-app
        uses: docker/build-push-action@v6
        with:
          context: ./granyt-app
          file: ./docker/Dockerfile
          target: runner
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-amd64-${{ github.sha }}
          cache-from: type=gha,scope=app-amd64
          cache-to: type=gha,mode=max,scope=app-amd64
          platforms: linux/amd64

      - name: Build and push Migrations image (amd64)
        id: build-migrations
        uses: docker/build-push-action@v6
        with:
          context: ./granyt-app
          file: ./docker/Dockerfile
          target: migrations
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-migrations-amd64-${{ github.sha }}
          cache-from: type=gha,scope=migrations-amd64
          cache-to: type=gha,mode=max,scope=migrations-amd64
          platforms: linux/amd64

  # Build for arm64 on native ARM runner (only for main/tags)
  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: lint-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    outputs:
      app-digest: ${{ steps.build-app.outputs.digest }}
      migrations-digest: ${{ steps.build-migrations.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push App image (arm64)
        id: build-app
        uses: docker/build-push-action@v6
        with:
          context: ./granyt-app
          file: ./docker/Dockerfile
          target: runner
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-arm64-${{ github.sha }}
          cache-from: type=gha,scope=app-arm64
          cache-to: type=gha,mode=max,scope=app-arm64
          platforms: linux/arm64

      - name: Build and push Migrations image (arm64)
        id: build-migrations
        uses: docker/build-push-action@v6
        with:
          context: ./granyt-app
          file: ./docker/Dockerfile
          target: migrations
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-migrations-arm64-${{ github.sha }}
          cache-from: type=gha,scope=migrations-arm64
          cache-to: type=gha,mode=max,scope=migrations-arm64
          platforms: linux/arm64

  # Create multi-arch manifest and apply final tags
  publish-manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    # Run even if arm64 is skipped (staging branch)
    if: always() && needs.build-amd64.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for App image
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Set latest tag for version tags only
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Set staging tag for staging branch
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Tag with short SHA (always)
            type=sha,prefix=sha-
            # Tag staging builds with staging-sha for traceability
            type=sha,prefix=staging-,enable=${{ github.ref == 'refs/heads/staging' }}
            # Custom tag from workflow dispatch
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Extract metadata for Migrations image
        id: meta-migrations
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-migrations
          tags: |
            # latest-migrations tag for version tags only
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # staging-migrations tag for staging branch
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag with short SHA
            type=sha,prefix=sha-
            # Tag staging builds with staging-sha for traceability
            type=sha,prefix=staging-,enable=${{ github.ref == 'refs/heads/staging' }}

      - name: Create and push App multi-arch manifest
        env:
          APP_TAGS: ${{ steps.meta-app.outputs.tags }}
        run: |
          # Determine if we have arm64 build
          if [[ "${{ needs.build-arm64.result }}" == "success" ]]; then
            SOURCES="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-amd64-${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-arm64-${{ github.sha }}"
          else
            SOURCES="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-amd64-${{ github.sha }}"
          fi

          # Create manifest for each tag
          echo "$APP_TAGS" | while IFS= read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools create -t "$tag" $SOURCES
          done

      - name: Create and push Migrations multi-arch manifest
        env:
          MIGRATIONS_TAGS: ${{ steps.meta-migrations.outputs.tags }}
        run: |
          # Determine if we have arm64 build
          if [[ "${{ needs.build-arm64.result }}" == "success" ]]; then
            SOURCES="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-migrations-amd64-${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-migrations-arm64-${{ github.sha }}"
          else
            SOURCES="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-migrations-amd64-${{ github.sha }}"
          fi

          # Create manifest for each tag
          echo "$MIGRATIONS_TAGS" | while IFS= read -r tag; do
            [ -n "$tag" ] && docker buildx imagetools create -t "$tag" $SOURCES
          done

      - name: Image digest summary
        run: |
          echo "##  Published Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### App Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-app.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Migrations Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-migrations.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
